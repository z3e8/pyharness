# Dependabot: keep the uv lockfile and the GitHub Actions we pin current.
version: 2
updates:
  # Python dependencies resolved in uv.lock (Dependabot's native uv ecosystem).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The action versions pinned in .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
