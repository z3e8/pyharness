# Test suite across the supported Python versions. The `requires-python =
# ">=3.11"` claim is exercised on 3.11 / 3.12 / 3.13. No API key is needed —
# the suite is hermetic (see tests/conftest.py).
name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # One macOS leg exercises the real Seatbelt sandbox. The sandbox tests
          # skipif off Darwin, so on the Linux legs they skip (expected) and are
          # only actually run here. Pinned to one Python to keep macOS minutes low.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group dev --python ${{ matrix.python-version }}
      - name: Run tests
        # Linux has no OS sandbox, so the startup gate (broker/remote/sandbox.py)
        # refuses to start a kernel unless this opt-in is set — without it the
        # suite goes red on Linux. macOS always sandboxes and ignores the flag.
        env:
          PYHARNESS_ALLOW_UNSANDBOXED: ${{ runner.os == 'Linux' && 'true' || '' }}
        run: uv run pytest -q
