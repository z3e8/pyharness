# Test suite across the supported Python versions. The `requires-python =
# ">=3.11"` claim is exercised on 3.11 / 3.12 / 3.13. No API key is needed —
# the suite is hermetic (see tests/conftest.py).
name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # One macOS leg exercises the real Seatbelt sandbox; the Linux legs
          # exercise the real Landlock+seccomp one. Each backend's tests skipif
          # off its own platform, so both are only actually run on the leg that
          # can enforce them. macOS is pinned to one Python to keep minutes low.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group dev --python ${{ matrix.python-version }}
      - name: Run tests
        # Deliberately no PYHARNESS_ALLOW_UNSANDBOXED. Both platforms now have a
        # real OS sandbox, so the startup gate (broker/remote/sandbox.py) is
        # satisfied on its own — and the whole suite running green *without* the
        # opt-in is the evidence that confinement is actually in force. If a
        # runner ever lands on a kernel below the Landlock floor this goes red
        # rather than silently running unconfined, which is the intended failure.
        run: uv run pytest -q
