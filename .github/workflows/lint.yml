# Lint + format gate (ruff) plus a non-blocking type pass (mypy). Config for all
# three lives in pyproject.toml under [tool.ruff] / [tool.mypy].
name: lint

# Manual trigger only. Nothing runs on push or pull_request; start a run from the
# Actions tab or with `gh workflow run lint.yml`.
on:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exact tag on purpose — see the note in test.yml.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --group dev
      # Through make so the lint scope lives in exactly one place: this job used
      # to hardcode `pyharness tests` while LINT_PATHS had already grown `evals`,
      # and because CI had never run, nothing caught the drift.
      - run: make lint

  mypy:
    # Non-blocking on purpose: the type pass is lenient and still surfaces ~100
    # findings. It runs for signal, not to gate merges — hence continue-on-error.
    name: mypy (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # Exact tag on purpose — see the note in test.yml.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: make typecheck
