name: Bug report
description: Report something that behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. **Do not report security vulnerabilities here** —
        see [SECURITY.md](../blob/main/SECURITY.md) and use GitHub's private
        vulnerability reporting instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal task, command, or code snippet that triggers it.
      placeholder: |
        1. uv run pyharness run "..."
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS + version, Python version, and pyharness commit/version.
      placeholder: |
        - OS: macOS 15.5 / Ubuntu 24.04
        - Python: 3.12
        - pyharness: commit <sha>
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: >
        Relevant output or a session digest (`uv run pyharness show`).
        Redact any secrets, tokens, or `.env` contents before pasting.
      render: shell
    validations:
      required: false
