# Local observability for pyharness — one container.
#
#   docker compose -f deploy/observability/docker-compose.yml up -d
#   (or just `make up` / `make dev` from the repo root)
#
# Phoenix is an OTLP-native, LLM/agent-aware trace UI. pyharness exports straight
# to it — no collector, no databases. Each turn shows up as a trace
# (turn → llm call / code cell → capability call) with per-call cost, tokens, and
# latency. Open http://localhost:6006.
#
# Going multi-user / to the cloud? See docker-compose.langfuse.yml for the
# heavier Langfuse + collector + Prometheus stack. The app code is identical;
# only OTEL_EXPORTER_OTLP_ENDPOINT changes.

name: pyharness-observability

services:
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # web UI
      - "4317:4317"   # OTLP gRPC intake
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix-data:/mnt/data   # persist traces across restarts

volumes:
  phoenix-data:
