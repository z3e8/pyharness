<style>
/* pyharness viewer — one stylesheet for the live view, the baked session pages,
   the site index, and the eval boards. Everything is driven by the tokens in
   `:root`, so light mode is a token swap rather than a second stylesheet.

   Theme resolution: `data-theme` on <html> wins (the toggle writes it and
   persists it); with no attribute we follow the OS. Both directions are
   spelled out so the toggle can override a system preference either way. */

:root {
  --bg:        #0d0f13;
  --bg-elev:   #14171d;
  --bg-sunken: #0a0c0f;
  --bg-hover:  #1b1f27;
  --border:    #232833;
  --border-lo: #1a1e26;
  --text:      #dfe4ec;
  --text-dim:  #97a0b1;
  --text-faint:#6b7383;
  --accent:    #74a9ff;
  --accent-bg: #16243d;
  --ok:        #62d191;
  --ok-bg:     #10281c;
  --warn:      #f0c274;
  --warn-bg:   #2e2410;
  --danger:    #ff8b8b;
  --danger-bg: #2e1618;
  --violet:    #b49bff;
  --violet-bg: #1e1a33;
  --brand:     #7F77DD;   /* the logo's accent block — fixed in both themes */
  --logo-ink:  #E6E9F0;   /* the logo's dark blocks, inverted for a dark page */
  --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);

  --r-sm: 6px;
  --r:    10px;
  --r-lg: 14px;
  --col:  min(100%, 50rem);  /* the reading column, shared by feed and docs */
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        #ffffff;
    --bg-elev:   #f7f8fa;
    --bg-sunken: #f2f4f7;
    --bg-hover:  #eceff4;
    --border:    #dfe3ea;
    --border-lo: #eaedf2;
    --text:      #14181f;
    --text-dim:  #59616f;
    --text-faint:#858d9c;
    --accent:    #1f5fd0;
    --accent-bg: #eaf1ff;
    --ok:        #127a48;
    --ok-bg:     #e4f6ec;
    --warn:      #8a5a09;
    --warn-bg:   #fdf1dc;
    --danger:    #bb2a30;
    --danger-bg: #fdeaea;
    --violet:    #5b3fc4;
    --violet-bg: #f0ecff;
    --brand:     #7F77DD;
    --logo-ink:  #1E2433;   /* the brand's own ink, on a light page */
    --shadow:    0 1px 2px rgba(15,20,30,.06), 0 8px 24px -14px rgba(15,20,30,.24);
    color-scheme: light;
  }
}

:root[data-theme="light"] {
  --bg:        #ffffff;
  --bg-elev:   #f7f8fa;
  --bg-sunken: #f2f4f7;
  --bg-hover:  #eceff4;
  --border:    #dfe3ea;
  --border-lo: #eaedf2;
  --text:      #14181f;
  --text-dim:  #59616f;
  --text-faint:#858d9c;
  --accent:    #1f5fd0;
  --accent-bg: #eaf1ff;
  --ok:        #127a48;
  --ok-bg:     #e4f6ec;
  --warn:      #8a5a09;
  --warn-bg:   #fdf1dc;
  --danger:    #bb2a30;
  --danger-bg: #fdeaea;
  --violet:    #5b3fc4;
  --violet-bg: #f0ecff;
  --brand:     #7F77DD;
  --logo-ink:  #1E2433;
  --shadow:    0 1px 2px rgba(15,20,30,.06), 0 8px 24px -14px rgba(15,20,30,.24);
  color-scheme: light;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

::selection { background: var(--accent-bg); }

/* ---------------------------------------------------------------- shell --- */

.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }

#rail {
  position: sticky; top: 0; align-self: start; height: 100vh;
  display: flex; flex-direction: column;
  background: var(--bg-elev); border-right: 1px solid var(--border);
}
.rail-head { padding: 18px 16px 14px; display: flex; align-items: center; gap: 10px; }
/* The mark's dark blocks are `currentColor` (see logo.svg), so the ink follows
   the theme while the accent block stays brand violet in both. */
.rail-head .mark { height: 21px; width: auto; flex: none; color: var(--logo-ink); }
.rail-head .wordmark {
  font-weight: 560; letter-spacing: -.025em; font-size: 17px; color: var(--logo-ink);
}
.rail-head .wordmark b { color: var(--brand); font-weight: inherit; }
.rail-head .theme {
  margin-left: auto; width: 28px; height: 28px; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--bg); color: var(--text-dim);
  cursor: pointer; font-size: 13px; line-height: 1; display: grid; place-items: center;
}
.rail-head .theme:hover { background: var(--bg-hover); color: var(--text); }

.rail-nav { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 1px; }
.rail-nav a, .rail-nav .navitem {
  display: flex; align-items: center; gap: 9px; padding: 7px 10px;
  border-radius: var(--r-sm); color: var(--text-dim); font-size: 13.5px;
}
.rail-nav a:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; }
.rail-nav a.on { background: var(--accent-bg); color: var(--accent); font-weight: 550; }
.rail-nav .ico { width: 15px; text-align: center; opacity: .85; flex: none; }

.rail-label {
  padding: 14px 16px 6px; font-size: 11px; letter-spacing: .07em;
  text-transform: uppercase; color: var(--text-faint);
  display: flex; align-items: center; gap: 8px;
}
.rail-label .follow { margin-left: auto; text-transform: none; letter-spacing: 0;
  font-size: 11px; color: var(--text-faint); display: flex; align-items: center;
  gap: 4px; cursor: pointer; }

/* The switcher list and a board's table of contents share the rail's one
   scrollable slot — neither may push the wordmark off the top. */
#sessions, #toc { overflow-y: auto; padding: 0 10px 20px; flex: 1; min-height: 0; }
.slist-empty { padding: 8px 10px; color: var(--text-faint); font-size: 13px; }

.sitem {
  display: block; padding: 8px 10px; border-radius: var(--r-sm);
  color: var(--text-dim); border: 1px solid transparent; cursor: pointer;
  width: 100%; text-align: left; background: none; font: inherit;
}
.sitem:hover { background: var(--bg-hover); text-decoration: none; }
.sitem.on { background: var(--bg); border-color: var(--border); color: var(--text); }
.sitem .n {
  display: block; font-size: 13.5px; font-weight: 520; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sitem .m {
  display: flex; gap: 7px; align-items: center; margin-top: 3px;
  font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums;
}

/* ------------------------------------------------------------- topbar ----- */

.main { min-width: 0; display: flex; flex-direction: column; }

#topbar {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
/* The topbar shares the feed's reading column, so the title, the toolbar, and
   the transcript all hang off one left edge instead of three. */
.tb-row, .tb-tools { width: var(--col); margin: 0 auto; }
.tb-row { display: flex; align-items: center; gap: 12px; padding: 12px 24px; }
.tb-title { font-weight: 620; font-size: 15px; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-stats { display: flex; gap: 14px; align-items: center; margin-left: auto;
  font-size: 12.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.tb-stats b { color: var(--text); font-weight: 560; }
.tb-stats .spend b { color: var(--ok); }

.dotstat { display: inline-flex; align-items: center; gap: 6px; }
.dotstat::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-faint);
}
.dotstat.live::before { background: var(--ok); animation: pulse 1.8s ease-in-out infinite; }
.dotstat.warn::before { background: var(--warn); }
.dotstat.err::before  { background: var(--danger); }
@keyframes pulse { 50% { opacity: .35; } }

.tb-tools { display: flex; align-items: center; gap: 8px; padding: 0 24px 10px; }
.search {
  flex: 1; max-width: 340px; display: flex; align-items: center; gap: 7px;
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 999px; padding: 5px 12px; color: var(--text-faint);
}
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; background: none; border: 0; color: var(--text);
  font: 13px var(--sans); outline: none; min-width: 0; }
.search .count { font-size: 11.5px; white-space: nowrap; }

.menu { position: relative; }
.btn {
  border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-dim);
  border-radius: 999px; padding: 5px 13px; cursor: pointer; font: 13px var(--sans);
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--bg-hover); color: var(--text); }
.menu-pop {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 10;
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--r); padding: 6px; min-width: 178px; box-shadow: var(--shadow);
}
.menu-pop[hidden] { display: none; }
.menu-pop label {
  display: flex; align-items: center; gap: 9px; padding: 6px 9px;
  border-radius: var(--r-sm); font-size: 13.5px; color: var(--text-dim); cursor: pointer;
}
.menu-pop label:hover { background: var(--bg-hover); color: var(--text); }

/* ------------------------------------------------------------ banners ---- */

#banner:empty, #now:empty { display: none; }
#banner, #now { width: var(--col); margin: 0 auto; padding: 0 24px; }
#banner > *, #now > * { margin: 8px 0 0; }

.approval {
  background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
  color: var(--warn); border-radius: var(--r); padding: 10px 14px;
  display: flex; gap: 10px; align-items: baseline; font-size: 13.5px;
}
.approval .elapsed { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .8; }

.nowitem {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--r);
  padding: 8px 14px; display: flex; gap: 10px; align-items: center;
  font-size: 13.5px; color: var(--text-dim);
}
.nowitem .spin {
  width: 11px; height: 11px; border-radius: 50%; flex: none;
  border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-top-color: var(--accent); animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.nowitem .elapsed { margin-left: auto; color: var(--text-faint);
  font-variant-numeric: tabular-nums; }

/* --------------------------------------------------------------- feed ---- */

#log { padding: 20px 24px 140px; }
#log, .doc-body { width: var(--col); margin: 0 auto; }

.turn { margin: 0 0 4px; }

/* the operator's instruction */
.task {
  margin: 20px 0 22px; padding: 14px 16px; border-radius: var(--r-lg);
  background: var(--bg-elev); border: 1px solid var(--border);
}
.task .who {
  font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-faint); margin-bottom: 6px;
}

/* the model's prose */
.msg { margin: 16px 0; }

/* the final answer */
.answer {
  margin: 22px 0; padding: 16px 18px; border-radius: var(--r-lg);
  background: var(--ok-bg);
  border: 1px solid color-mix(in srgb, var(--ok) 32%, transparent);
}
.answer .who {
  font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ok); margin-bottom: 8px; font-weight: 600;
}

/* a step: one code cell and everything it caused */
.step {
  margin: 14px 0; border: 1px solid var(--border); border-radius: var(--r-lg);
  background: var(--bg-elev); overflow: hidden;
}
.step-head {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px;
  border-bottom: 1px solid var(--border-lo); font-size: 12px; color: var(--text-faint);
}
.step-head .idx {
  font-variant-numeric: tabular-nums; color: var(--text-dim); font-weight: 560;
  flex: none; white-space: nowrap;  /* a busy step's chips must not wrap it */
}
.step-head .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-left: auto;
  justify-content: flex-end; }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px;
  border-radius: 999px; font: 11.5px var(--mono); background: var(--bg-sunken);
  border: 1px solid var(--border-lo); color: var(--text-dim); white-space: nowrap;
}
.chip.ok::before   { content: "✓"; color: var(--ok); }
.chip.err  { background: var(--danger-bg); border-color: color-mix(in srgb, var(--danger) 30%, transparent); color: var(--danger); }
.chip.err::before  { content: "✕"; }
.chip.deny { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 45%, transparent); color: var(--warn); font-weight: 600; }
.chip.deny::before { content: "⛔"; }
.chip .t { color: var(--text-faint); }

.cellbar {
  display: flex; align-items: center; gap: 8px; padding: 6px 14px;
  font: 11.5px var(--mono); color: var(--text-faint);
  border-top: 1px solid var(--border-lo);
}
.step > .cellbar:first-of-type { border-top: 0; }
.cellbar .lbl { text-transform: uppercase; letter-spacing: .06em; }
.cellbar .peek { color: var(--text-dim); overflow: hidden; white-space: nowrap;
  text-overflow: ellipsis; flex: 1; min-width: 0; }
.cellbar .tools { margin-left: auto; display: flex; gap: 4px; flex: none; }
.mini {
  border: 1px solid var(--border); background: var(--bg); color: var(--text-faint);
  border-radius: 5px; padding: 1px 7px; cursor: pointer; font: 11px var(--sans);
}
.mini:hover { background: var(--bg-hover); color: var(--text); }
.mini.on { color: var(--accent); border-color: var(--accent); }

.cellbody { padding: 0 14px 12px; }
.cellbody[hidden] { display: none; }

pre.src {
  margin: 0; padding: 12px 14px; border-radius: var(--r);
  background: var(--bg-sunken); border: 1px solid var(--border-lo);
  overflow-x: auto; white-space: pre; tab-size: 4;
  font: 12.5px/1.55 var(--mono); color: var(--text);
}
pre.out {
  margin: 0; padding: 12px 14px; border-radius: var(--r);
  background: var(--bg-sunken); border: 1px solid var(--border-lo);
  overflow-x: auto; white-space: pre-wrap; word-break: break-word;
  font: 12.5px/1.55 var(--mono); color: var(--text-dim);
}
.clamp { max-height: 300px; overflow: hidden; position: relative; }
.clamp::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 64px;
  background: linear-gradient(transparent, var(--bg-elev));
  pointer-events: none;
}
.more {
  display: block; width: 100%; margin-top: 6px; padding: 4px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text-dim);
  border-radius: var(--r-sm); cursor: pointer; font: 12px var(--sans);
}
.more:hover { background: var(--bg-hover); color: var(--text); }

/* Rendered tool output is a quotation, not the page's own voice — its headings
   must not outrank the transcript around them. */
.cellbody .md h1 { font-size: 16px; }
.cellbody .md h2 { font-size: 14.5px; }
.cellbody .md h3, .cellbody .md h4 { font-size: 13.5px; }
.cellbody .md { font-size: 14px; }

img.shot {
  max-width: 100%; border-radius: var(--r); border: 1px solid var(--border);
  display: block; margin: 4px 0;
}

/* thinking + the full prompt snapshot: present, quiet, collapsed */
details.fold { margin: 10px 0; }
details.fold > summary {
  cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px;
  font: 11.5px var(--mono); color: var(--text-faint); padding: 4px 0;
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before {
  content: "▸"; font-size: 10px; transition: transform .12s;
}
details.fold[open] > summary::before { transform: rotate(90deg); }
details.fold > summary:hover { color: var(--text-dim); }
details.fold .body {
  border-left: 2px solid var(--border); padding-left: 12px; margin: 4px 0 0 4px;
}
.think .body pre { color: var(--text-dim); font-style: italic; }
.prompt .role {
  font: 11px var(--mono); color: var(--accent); text-transform: uppercase;
  letter-spacing: .06em; margin: 10px 0 3px;
}
.prompt .role.sys { color: var(--violet); }
.prompt pre { max-height: 280px; overflow: auto; }

/* one-line records */
.note { font-size: 12.5px; color: var(--text-faint); margin: 8px 0;
  display: flex; gap: 8px; align-items: baseline; }
.note.err { color: var(--danger); white-space: pre-wrap; }
.note.warn { color: var(--warn); }

/* a spawned sub-agent, inline at its spawn point */
.subagent {
  margin: 14px 0; border: 1px solid color-mix(in srgb, var(--violet) 32%, var(--border));
  border-radius: var(--r-lg); background: var(--bg-elev); overflow: hidden;
}
.subagent > summary {
  cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: center;
  padding: 10px 14px; background: var(--violet-bg); font-size: 13px;
}
.subagent > summary::-webkit-details-marker { display: none; }
.subagent .sub-name { color: var(--violet); font-weight: 600; }
.subagent .sub-task { color: var(--text-dim); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.subagent .sub-stat { margin-left: auto; color: var(--text-faint); flex: none;
  font-variant-numeric: tabular-nums; font-size: 12px; }
.subagent .dot { width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: var(--accent); }
.subagent .dot.done { background: var(--ok); }
.subagent .dot.err { background: var(--danger); }
.sub-body { padding: 2px 16px 12px; }

/* ------------------------------------------------------------ markdown --- */

.md > *:first-child { margin-top: 0; }
.md > *:last-child { margin-bottom: 0; }
.md p { margin: 0 0 10px; }
.md h1, .md h2, .md h3, .md h4 {
  margin: 20px 0 8px; line-height: 1.3; letter-spacing: -.01em; font-weight: 620;
}
.md h1 { font-size: 21px; }
.md h2 { font-size: 17px; }
.md h3 { font-size: 15px; }
.md h4 { font-size: 13.5px; color: var(--text-dim); }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md li { margin: 3px 0; }
.md li > ul, .md li > ol { margin: 3px 0; }
.md blockquote {
  margin: 10px 0; padding: 2px 0 2px 14px; border-left: 3px solid var(--border);
  color: var(--text-dim);
}
.md hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
.md code {
  font: 12.5px var(--mono); background: var(--bg-sunken);
  border: 1px solid var(--border-lo); border-radius: 5px; padding: .5px 5px;
}
.md pre {
  margin: 0 0 12px; padding: 12px 14px; border-radius: var(--r);
  background: var(--bg-sunken); border: 1px solid var(--border-lo);
  overflow-x: auto; font: 12.5px/1.55 var(--mono); white-space: pre;
}
.md pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.md strong { font-weight: 640; color: var(--text); }
.md del { color: var(--text-faint); }
.md .tablewrap { overflow-x: auto; margin: 0 0 12px; }
.md table { border-collapse: collapse; font-size: 13.5px; min-width: 100%; }
.md th, .md td {
  border: 1px solid var(--border-lo); padding: 6px 11px; text-align: left;
  vertical-align: top;
}
.md th { background: var(--bg-sunken); font-weight: 600; white-space: nowrap; }
.md td:has(> code:only-child) { white-space: nowrap; }

/* ------------------------------------------------------- index + docs ---- */

.page { padding: 32px 24px 80px; }
.page-head { width: var(--col); margin: 0 auto 26px; }
.page-head h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 8px; }
.page-head .lede { color: var(--text-dim); margin: 0; font-size: 15px; }

.stats { display: flex; flex-wrap: wrap; gap: 10px; width: var(--col);

<script>
/* A small markdown renderer that builds DOM nodes.
 *
 * Everything it renders is untrusted: model prose, tool output, a page the
 * agent fetched, an eval board. So the one rule this file exists to keep is
 * that no string from the input ever reaches `innerHTML`. Text lands via
 * `textContent`, structure comes from `createElement`, and the only attribute
 * ever set from input is `href` — behind a scheme allowlist, because
 * `javascript:` in a link is the whole attack.
 *
 * Supported, because it is what actually shows up in these traces: fenced and
 * indented code, ATX headings, hr, blockquotes, nested lists, GFM pipe tables
 * (invoices and eval boards are full of them), and inline code / bold / italic
 * / strike / links / autolinks.
 *
 * Exposes `renderMarkdown(text) -> HTMLDivElement` and `looksLikeMarkdown(text)`.
 */

(function (global) {
  "use strict";

  var SAFE_SCHEME = /^(https?:|mailto:|#|\/)/i;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  /* ---------------------------------------------------------------- inline */

  // Ordered by how greedily each pattern should win. Code first: a backtick
  // span is literal, so `**x**` inside it must not become bold.
  var INLINE = [
    { re: /`([^`\n]+)`/, node: function (m) { return el("code", null, m[1]); } },
    { re: /\*\*([^\n]+?)\*\*/, node: function (m) { return inlineInto(el("strong"), m[1]); } },
    { re: /__([^\n]+?)__/, node: function (m) { return inlineInto(el("strong"), m[1]); } },
    { re: /~~([^\n]+?)~~/, node: function (m) { return inlineInto(el("del"), m[1]); } },
    { re: /(?:^|(?<=[\s(]))\*([^*\n]+?)\*/, node: function (m) { return inlineInto(el("em"), m[1]); } },
    { re: /(?:^|(?<=[\s(]))_([^_\n]+?)_/, node: function (m) { return inlineInto(el("em"), m[1]); } },
    { re: /\[([^\]\n]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/, node: function (m) { return link(m[2], m[1] || m[2]); } },
    { re: /<((?:https?:\/\/|mailto:)[^>\s]+)>/, node: function (m) { return link(m[1], m[1]); } },
    { re: /(?:^|(?<=[\s(<]))(https?:\/\/[^\s<>()"']+[^\s<>()"'.,;:!?])/, node: function (m) { return link(m[1], m[1]); } },
  ];

  function link(href, text) {
    if (!SAFE_SCHEME.test(href)) return document.createTextNode(text);
    var a = el("a", null, text);
    a.href = href;
    if (/^https?:/i.test(href)) {
      a.target = "_blank";
      a.rel = "noopener noreferrer";
    }
    return a;
  }

  /** Append the inline rendering of `text` into `parent`, and return `parent`. */
  function inlineInto(parent, text) {
    var rest = String(text == null ? "" : text);
    while (rest) {
      var best = null;
      for (var i = 0; i < INLINE.length; i++) {
        var m = INLINE[i].re.exec(rest);
        if (m && (best === null || m.index < best.m.index)) {
          best = { m: m, rule: INLINE[i] };
          if (m.index === 0) break;
        }
      }
      if (!best) break;
      if (best.m.index > 0) parent.appendChild(document.createTextNode(rest.slice(0, best.m.index)));
      parent.appendChild(best.rule.node(best.m));
      rest = rest.slice(best.m.index + best.m[0].length);
    }
    if (rest) parent.appendChild(document.createTextNode(rest));
    return parent;
  }

  /* ----------------------------------------------------------------- table */

  function splitRow(line) {
    var cells = [];
    var cur = "";
    var esc = false;
    var body = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    for (var i = 0; i < body.length; i++) {
      var c = body[i];
      if (esc) { cur += c; esc = false; continue; }
      if (c === "\\") { esc = true; continue; }
      if (c === "|") { cells.push(cur.trim()); cur = ""; continue; }
      cur += c;
    }
    cells.push(cur.trim());
    return cells;
  }

  var DIVIDER = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;

  function table(lines, start) {
    // A table is a header row, a `---|---` divider, then body rows. Anything
    // else and the caller falls through to paragraph handling.
    if (start + 1 >= lines.length) return null;
    if (lines[start].indexOf("|") === -1) return null;
    if (!DIVIDER.test(lines[start + 1])) return null;

    var head = splitRow(lines[start]);
    var i = start + 2;
    var rows = [];
    while (i < lines.length && lines[i].indexOf("|") !== -1 && lines[i].trim()) {
      rows.push(splitRow(lines[i]));
      i++;
    }
    var wrap = el("div", "tablewrap");
    var t = el("table");
    var thead = el("thead");
    var tr = el("tr");
    head.forEach(function (h) { tr.appendChild(inlineInto(el("th"), h)); });
    thead.appendChild(tr);
    t.appendChild(thead);
    var tbody = el("tbody");
    rows.forEach(function (r) {
      var row = el("tr");
      for (var c = 0; c < head.length; c++) {
        row.appendChild(inlineInto(el("td"), r[c] === undefined ? "" : r[c]));
      }
      tbody.appendChild(row);
    });
    t.appendChild(tbody);
    wrap.appendChild(t);
    return { node: wrap, next: i };
  }

  /* ------------------------------------------------------------------ list */

  var BULLET = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;

  /** Consume one list (and its nested sublists) starting at `start`. */
  function list(lines, start) {
    var first = BULLET.exec(lines[start]);
    var indent = first[1].length;
    var ordered = /\d/.test(first[2]);
    var root = el(ordered ? "ol" : "ul");
    var i = start;
    var item = null;
    var buf = [];

    function flush() {
      if (!item) return;
      inlineInto(item, buf.join("\n").trim());
      buf = [];
    }

    while (i < lines.length) {
      var line = lines[i];
      var m = BULLET.exec(line);
      if (m && m[1].length <= indent) {
        if (m[1].length < indent) break;
        if (/\d/.test(m[2]) !== ordered) break;
        flush();
        item = el("li");
        root.appendChild(item);
        buf.push(m[3]);
        i++;
        continue;
      }
      if (m && m[1].length > indent && item) {
        flush();
        var sub = list(lines, i);
        item.appendChild(sub.node);
        i = sub.next;
        continue;
      }
      // A lazy continuation line: indented text under the current bullet.
      if (item && line.trim() && /^\s{2,}/.test(line)) { buf.push(line.trim()); i++; continue; }
      break;
    }
    flush();
    return { node: root, next: i };
  }

  /* ---------------------------------------------------------------- blocks */

  function render(text) {
    var out = el("div", "md");
    var lines = String(text == null ? "" : text).replace(/\r\n?/g, "\n").split("\n");
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];

      if (!line.trim()) { i++; continue; }

      // fenced code — ``` or ~~~, with an optional info string
      var fence = /^\s*(```+|~~~+)\s*([\w+-]*)\s*$/.exec(line);
      if (fence) {
        var close = fence[1][0];
        var body = [];
        i++;
        while (i < lines.length && !new RegExp("^\\s*" + close + "{" + fence[1].length + ",}\\s*$").test(lines[i])) {
          body.push(lines[i]);
          i++;
        }
        i++; // the closing fence (or the end of input)
        var pre = el("pre");
        var code = el("code", fence[2] ? "lang-" + fence[2] : null, body.join("\n"));
        pre.appendChild(code);
        out.appendChild(pre);
        continue;
      }

      var head = /^(#{1,6})\s+(.*?)\s*#*$/.exec(line);
      if (head) {
        out.appendChild(inlineInto(el("h" + Math.min(head[1].length, 4)), head[2]));
        i++;
        continue;
      }

      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { out.appendChild(el("hr")); i++; continue; }

      if (/^\s*>/.test(line)) {
        var quoted = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          quoted.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        var bq = el("blockquote");
        bq.appendChild(render(quoted.join("\n")));
        out.appendChild(bq);
        continue;
      }

      var tbl = table(lines, i);
      if (tbl) { out.appendChild(tbl.node); i = tbl.next; continue; }

      if (BULLET.test(line)) {
        var lst = list(lines, i);
        out.appendChild(lst.node);
        i = lst.next;
        continue;
      }

      // paragraph — runs to the next blank line or block opener
      var para = [];
      while (i < lines.length && lines[i].trim()) {
        var l = lines[i];
        if (/^\s*(```|~~~)/.test(l) || /^#{1,6}\s/.test(l) || /^\s*>/.test(l) ||
            BULLET.test(l) || (l.indexOf("|") !== -1 && DIVIDER.test(lines[i + 1] || ""))) break;
        para.push(l);
        i++;
      }
      if (para.length) {
        var p = el("p");
        for (var k = 0; k < para.length; k++) {
          if (k) p.appendChild(el("br"));
          inlineInto(p, para[k].trim());
        }
        out.appendChild(p);
      }
    }
    return out;
  }

  /** Is this text a *document*, or just program output that happens to contain
   *  a `#`?
   *
   *  This decides whether a tool result renders as prose or stays verbatim, so
   *  a loose answer is expensive in both directions: too eager and a tool's
   *  one-line `# browser — drive a headless browser…` blurb becomes a giant
   *  heading; too strict and a fetched invoice stays a wall of pipes. So: a
   *  table or a code fence is decisive on its own (nothing else produces
   *  either by accident), and anything weaker has to corroborate — two
   *  independent signals, where a lone heading is not one. */
  function looksLikeMarkdown(text) {
    var t = String(text == null ? "" : text);
    if (!t.trim()) return false;

    var lines = t.split("\n");
    for (var i = 0; i < lines.length - 1; i++) {
      if (lines[i].indexOf("|") !== -1 && DIVIDER.test(lines[i + 1])) return true;
    }
    if (/^\s*(```|~~~)/m.test(t)) return true;

    var count = function (re) { return (t.match(re) || []).length; };
    var signals =
      (count(/^#{1,6}\s+\S/gm) >= 2) +
      (count(/^\s*([-*+]|\d{1,9}[.)])\s+\S/gm) >= 2) +
      /\[[^\]\n]+\]\([^)\s]+\)/.test(t) +
      /\*\*[^\n*]+\*\*/.test(t);
    return signals >= 2;
  }

  global.renderMarkdown = render;
  global.looksLikeMarkdown = looksLikeMarkdown;
})(window);

</script>
<script>
/* The session renderer: a trace event stream in, a chat transcript out.
 *
 * One implementation serves both views. The live page feeds it Server-Sent
 * Events; the baked page feeds it a frozen array through the same `handle()`.
 * Nothing here knows which it is — that is the whole point of the split, and
 * why a published page cannot drift from what the operator watched.
 *
 * Shape of the output: the operator's task, then one *turn* per model
 * completion — its prose, then a step card holding the code it ran, the
 * actions that code triggered, and the output that came back — then the
 * answer. Prompt snapshots and thinking are present but folded away; a
 * refusal is not, because a refusal is the claim this project makes.
 *
 * Untrusted input, always: prose and output go through `renderMarkdown`
 * (DOM-built, never `innerHTML`), everything else through `textContent`.
 */

/* --------------------------------------------------------------- theme --- */

function isDark() {
  var set = document.documentElement.getAttribute("data-theme");
  if (set) return set === "dark";
  return !matchMedia("(prefers-color-scheme: light)").matches;
}
function wireTheme() {
  var btn = document.getElementById("theme");
  if (!btn) return;
  function paint() {
    btn.textContent = isDark() ? "☾" : "☀";
    btn.title = isDark() ? "Switch to light" : "Switch to dark";
  }
  btn.onclick = function () {
    var next = isDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("ph-theme", next); } catch (e) { /* private mode */ }
    paint();
  };
  paint();
}

/* ---------------------------------------------------------------- utils -- */

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function fmtUsd(x) {
  var v = Number(x) || 0;
  return v > 0 && v < 0.01 ? "$" + v.toFixed(4) : "$" + v.toFixed(2);
}
function fmtDur(s) {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + "m" + String(s % 60).padStart(2, "0") + "s";
}
function byId(id) { return document.getElementById(id); }

var rootLog, nowEl, bannerEl;
var active = new Map();     // laneKey -> {label, t0, lane}
var approvals = new Map();  // key -> {label, t0}
var lanes = new Map();      // session dir name -> lane
var rootName = null;
var followTail = true;
var sessionStartMs = 0;
var searchTerm = "";

addEventListener("scroll", function () {
  followTail = innerHeight + scrollY >= document.body.scrollHeight - 80;
  var jump = byId("jump");
  if (jump) jump.hidden = followTail;
});
function scrollTail() { if (followTail) scrollTo(0, document.body.scrollHeight); }

/* ---------------------------------------------------------------- cells -- */

function copyButton(getText) {
  var b = el("button", "mini", "copy");
  b.onclick = function (ev) {
    ev.preventDefault();
    if (navigator.clipboard) navigator.clipboard.writeText(getText() || "");
    b.textContent = "copied";
    setTimeout(function () { b.textContent = "copy"; }, 1200);
  };
  return b;
}

/** Clamp a tall body behind a "show more", so one 900-line output does not
 *  bury the rest of the session. */
function clamp(body, node) {
  requestAnimationFrame(function () {
    if (node.scrollHeight <= 320) return;
    node.classList.add("clamp");
    var more = el("button", "more", "show all (" + node.scrollHeight + "px)");
    more.onclick = function () {
      node.classList.toggle("clamp");
      more.textContent = node.classList.contains("clamp") ? "show all" : "show less";
    };
    body.appendChild(more);
  });
}

/** A code or output cell: a one-line bar that stays readable when collapsed,
 *  plus the body. Output that looks like markdown renders as markdown, with
 *  `raw` one click away — the record has to stay inspectable. */
function cell(kind, text) {
  text = text || "";
  var wrap = el("div", "cell k-" + kind);
  var bar = el("div", "cellbar");
  bar.appendChild(el("span", "lbl", kind));
  var first = text.split("\n", 1)[0].slice(0, 96);
  bar.appendChild(el("span", "peek", first));
  var tools = el("div", "tools");

  var body = el("div", "cellbody");
  var rendered = kind === "output" && window.looksLikeMarkdown && looksLikeMarkdown(text);

  function paint() {
    body.replaceChildren();
    if (rendered) {
      body.appendChild(renderMarkdown(text));
    } else {
      var pre = el("pre", kind === "code" ? "src" : "out", text);
      body.appendChild(pre);
      clamp(body, pre);
    }
  }

  if (kind === "output" && window.looksLikeMarkdown && looksLikeMarkdown(text)) {
    var raw = el("button", "mini", "raw");
    raw.onclick = function () {
      rendered = !rendered;
      raw.classList.toggle("on", !rendered);
      raw.textContent = rendered ? "raw" : "rendered";
      paint();
    };
    tools.appendChild(raw);
  }
  tools.appendChild(copyButton(function () { return text; }));
  var fold = el("button", "mini", "−");
  fold.onclick = function () {
    body.hidden = !body.hidden;
    fold.textContent = body.hidden ? "+" : "−";
  };
  tools.appendChild(fold);
  bar.appendChild(tools);
  wrap.appendChild(bar);
  wrap.appendChild(body);
  paint();
  return wrap;
}

/** The full prompt sent for one completion. Folded, and built only on first
 *  open — a session's prompt snapshots outweigh everything else on the page. */
function promptView(e) {
  var d = el("details", "fold prompt k-prompt");
  var sum = el("summary");
  sum.appendChild(el("span", null, "prompt" +
    (e.input_tokens ? " · " + e.input_tokens + " tok" : "") +
    (e.model ? " · " + e.model : "")));
  d.appendChild(sum);
  var body = el("div", "body");
  d.appendChild(body);
  var built = false;
  d.addEventListener("toggle", function () {
    if (!d.open || built) return;
    built = true;
    if (e.system) {
      body.appendChild(el("div", "role sys", "system"));
      body.appendChild(el("pre", "out", e.system));
    }
    (e.messages || []).forEach(function (m) {
      body.appendChild(el("div", "role", m.role));
      if (typeof m.text === "string") { body.appendChild(el("pre", "out", m.text)); return; }
      (m.content || []).forEach(function (b) {
        if (b.type === "text") body.appendChild(el("pre", "out", b.text || ""));
        else if (b.type === "tool_use") body.appendChild(el("pre", "out", "→ " + (b.name || "") +
          "\n" + ((b.input && b.input.code) || JSON.stringify(b.input || {}))));
        else if (b.type === "tool_result") body.appendChild(el("pre", "out", "⟵ result\n" +
          (typeof b.content === "string" ? b.content : JSON.stringify(b.content))));
        else if (b.type === "image") body.appendChild(el("pre", "out", "[image]"));
        else body.appendChild(el("pre", "out", JSON.stringify(b)));
      });
    });
  });
  return d;
}

/* ---------------------------------------------------------------- lanes -- */

function makeLane(name, logEl, isRoot, head) {
  var lane = { name: name, logEl: logEl, isRoot: isRoot, head: head, spend: 0, steps: 0,
    step: null, think: null, refused: new Set() };
  lanes.set(name, lane);
  return lane;
}
function laneFor(name) {
  if (!name || name === rootName) return lanes.get(rootName);
  return lanes.get(name) || openSubLane(name, null, lanes.get(rootName));
}
function shortName(name) { return name.replace(/^.*-spawn-/, "spawn-"); }

function openSubLane(name, spawn, parent) {
  if (lanes.get(name)) return lanes.get(name);
  var panel = el("details", "subagent");
  panel.open = true;
  var sum = el("summary");
  var dot = el("span", "dot");
  sum.appendChild(dot);
  sum.appendChild(el("span", "sub-name", shortName(name)));
  if (spawn) {
    if (spawn.tier) sum.appendChild(el("span", "chip", spawn.tier));
    sum.appendChild(el("span", "sub-task", spawn.text || ""));
  }
  var stat = el("span", "sub-stat", "running…");
  sum.appendChild(stat);
  panel.appendChild(sum);
  var body = el("div", "sub-body");
  panel.appendChild(body);
  (parent ? parent.logEl : rootLog).appendChild(panel);
  scrollTail();
  return makeLane(name, body, false, { dot: dot, stat: stat, budget: spawn && spawn.budget_usd });
}

function laneAdd(lane, node, kindClass) {
  node.classList.add("item-row");
  if (kindClass) node.classList.add(kindClass);
  lane.logEl.appendChild(node);
  applyRowVisibility(node);
  scrollTail();
  return node;
}

/** The step card: one code cell and everything that code caused. Opened by a
 *  `code` event, closed by the next completion, answer, or task. */
function stepCard(lane) {
  if (lane.step) return lane.step;
  var card = el("div", "step");
  var head = el("div", "step-head");
  lane.steps++;
  head.appendChild(el("span", "idx", "step " + lane.steps));
  var chips = el("div", "chips k-action");
  head.appendChild(chips);
  card.appendChild(head);
  laneAdd(lane, card);
  lane.step = { card: card, chips: chips };
  return lane.step;
}
function closeStep(lane) { lane.step = null; }

function into(lane, node, kindClass) {
  // Output and media belong to the step that produced them; anything arriving
  // without an open step still has to land somewhere visible.
  if (lane.step) {
    node.classList.add("item-row");
    if (kindClass) node.classList.add(kindClass);
    lane.step.card.appendChild(node);
    applyRowVisibility(node);
    scrollTail();
    return node;
  }
  return laneAdd(lane, node, kindClass);
}

/* ------------------------------------------------------------- rollups --- */

function updateStats() {
  var total = 0;
  lanes.forEach(function (l) { total += l.spend; });
  var c = byId("stat-cost");
  if (c) c.textContent = fmtUsd(total);
}
function laneSpent(lane, usd, cumulative) {
  if (usd == null) return;
  lane.spend = cumulative ? Math.max(lane.spend, usd) : lane.spend + usd;
  if (lane.head) {
    lane.head.stat.textContent = fmtUsd(lane.spend) +
      (lane.head.budget ? " / " + fmtUsd(lane.head.budget) : "");
  }
  updateStats();
}
function laneDone(lane, cls, label) {
  if (!lane.head) return;
  lane.head.dot.className = "dot " + cls;
  lane.head.stat.textContent = lane.head.stat.textContent.split(" — ")[0] + " — " + label;
}

/* --------------------------------------------------- in-flight + banner -- */

function renderNow() {
  if (!nowEl) return;
  nowEl.replaceChildren();
  active.forEach(function (a) {
    var item = el("div", "nowitem");
    item.appendChild(el("span", "spin"));
    item.appendChild(el("span", null,
      (a.lane && !a.lane.isRoot ? "[" + shortName(a.lane.name) + "] " : "") + a.label));
    item.appendChild(el("span", "elapsed", ""));
    item.dataset.t0 = a.t0;
    nowEl.appendChild(item);
  });
}
function renderBanner() {
  if (!bannerEl) return;
  bannerEl.replaceChildren();
  approvals.forEach(function (a) {
    var item = el("div", "approval");
    item.appendChild(el("span", null, "⚠"));
    item.appendChild(el("span", null, a.label));
    item.appendChild(el("span", "elapsed", ""));
    item.dataset.t0 = a.t0;
    bannerEl.appendChild(item);
  });
}
var ticker = setInterval(function () {
  if (!nowEl || !bannerEl) return;
  [].concat([].slice.call(nowEl.children), [].slice.call(bannerEl.children))
    .forEach(function (item) {
      var s = (Date.now() - Number(item.dataset.t0)) / 1000;
      item.querySelector(".elapsed").textContent = s.toFixed(0) + "s";
    });
  if (sessionStartMs) {
    var clock = byId("stat-clock");
    if (clock) clock.textContent = fmtDur((Date.now() - sessionStartMs) / 1000);
  }
}, 500);
function startActive(lane, sub, label) {
  active.set(lane.name + "\x00" + sub, { label: label, t0: Date.now(), lane: lane });
  renderNow();
}
function endActive(lane, sub) { active.delete(lane.name + "\x00" + sub); renderNow(); }

/* ------------------------------------------------- filters, search, nav -- */

function applyRowVisibility(node) {
  if (searchTerm && node.textContent.toLowerCase().indexOf(searchTerm) === -1) {
    node.classList.add("search-hide");
  } else {
    node.classList.remove("search-hide");
  }
}

function wireChrome() {
  document.querySelectorAll("#viewpop input[data-f]").forEach(function (cb) {
    cb.onchange = function () {
      document.body.classList.toggle("hide-" + cb.dataset.f, !cb.checked);
    };
  });
  var menu = byId("viewmenu"), pop = byId("viewpop");
  if (menu && pop) {
    menu.onclick = function (ev) { ev.stopPropagation(); pop.hidden = !pop.hidden; };
    pop.onclick = function (ev) { ev.stopPropagation(); };
    addEventListener("click", function () { pop.hidden = true; });
  }
  var search = byId("search");
  if (search) {
    search.oninput = function (ev) {
      searchTerm = ev.target.value.toLowerCase();
      var hits = 0;
      rootLog.querySelectorAll(".item-row").forEach(function (r) {
        applyRowVisibility(r);
        if (searchTerm && !r.classList.contains("search-hide")) hits++;
      });
      byId("searchcount").textContent = searchTerm ? hits + " match" : "";
    };
    addEventListener("keydown", function (ev) {
      if (ev.key === "/" && document.activeElement !== search) { ev.preventDefault(); search.focus(); }
      if (ev.key === "Escape" && document.activeElement === search) { search.blur(); }
    });
  }
  var jump = byId("jump");
  if (jump) {
    jump.onclick = function () { followTail = true; scrollTail(); jump.hidden = true; };
    jump.hidden = true;
  }
  renderSessionList();
}

/* -------------------------------------------------------------- sidebar -- */
/* Static pages carry their session list baked in (`window.SESSIONS`, and a
 * `currentSession` the feed assigns); the live viewer polls `/sessions` and
 * defines `switchTo`. Same markup either way, so the switcher looks and
 * behaves identically in the archive and in front of a running agent. */

var currentSession = null;
var sessionList = [];  // last list rendered — a re-render must not wipe the rail
var sessionSig = null;

function renderSessionList(list) {
  var host = byId("sessions");
  if (!host) return;
  var items = list || window.SESSIONS || sessionList;
  sessionList = items;
  // The live viewer polls every few seconds. Rebuilding the rail each time
  // would throw away scroll position and, worse, swap the node out from under
  // a click in flight — so repaint only when something actually moved.
  var sig = currentSession + "|" + items.map(function (s) {
    return s.name + ":" + s.outcome + ":" + s.steps + ":" + s.cost_usd;
  }).join(",");
  if (sig === sessionSig) return;
  sessionSig = sig;
  if (!items.length) {
    host.replaceChildren(el("div", "slist-empty", "no sessions yet"));
    return;
  }
  var frag = document.createDocumentFragment();
  items.forEach(function (s) {
    var node = s.href ? el("a", "sitem") : el("button", "sitem");
    if (s.href) node.href = s.href;
    if (s.name === currentSession) node.classList.add("on");
    node.appendChild(el("span", "n", s.name));
    if (s.outcome) {
      var m = el("span", "m");
      m.appendChild(el("span", "pill " + (s.outcome === "answered" ? "ok" : "warn"), s.outcome));
      node.appendChild(m);
    }
    // A baked page links; the live viewer switches the stream in place. Picking
    // a session by hand also stops following the newest — otherwise the next
    // poll drags you straight back to it, four seconds after you chose.
    if (!s.href) {
      node.onclick = function () {
        var follow = byId("follow");
        if (follow) follow.checked = false;
        window.switchTo(s.name);
      };
    }
    frag.appendChild(node);
  });
  host.replaceChildren(frag);
}

/** Site nav, for a baked page. The live viewer has nowhere to navigate to and
 *  supplies nothing, leaving the container empty. */
function renderNav(items) {
  var host = byId("nav");
  if (!host || !items || !items.length) return;
  var frag = document.createDocumentFragment();
  items.forEach(function (it) {
    var a = el("a");
    a.href = it.href;
    a.appendChild(el("span", "ico", it.icon || "\u25c6"));
    a.appendChild(document.createTextNode(it.label));
    frag.appendChild(a);
  });
  host.replaceChildren(frag);
}

function setStatus(text, cls) {
  var s = byId("status");
  if (!s) return;
  s.textContent = text;
  s.className = "dotstat " + (cls || "");
}

/* --------------------------------------------------------------- events -- */

function resetAll(name) {
  if (!rootLog) return;  // a docs/index page has no feed to reset
  rootLog.replaceChildren();
  nowEl.replaceChildren();
  bannerEl.replaceChildren();
  active.clear();
  approvals.clear();
  lanes.clear();
  rootName = name;
  currentSession = name;
  sessionStartMs = 0;
  makeLane(name, rootLog, true, null);
  var t = byId("session-title");
  if (t) t.textContent = name;
  document.title = "pyharness — " + name;
  updateStats();
}

function handle(e) {
  var k = e.kind;
  if (k === "watch_session") { resetAll(e.session); renderSessionList(); return; }
  if (rootName === null) resetAll(e.session || "session");
  if (!sessionStartMs) sessionStartMs = Date.now();
  var lane = laneFor(e.session);
  if (!lane) return;

  if (k === "spawn") {
    openSubLane(e.child, e, lane);
  } else if (k === "spawned_by") {
    // the child->parent link; the nested panel already carries the relationship
  } else if (k === "session_start") {
    laneAdd(lane, el("div", "note", "session started"));
  } else if (k === "task") {
    closeStep(lane);
    var task = el("div", "task");
    task.appendChild(el("div", "who", "task"));
    task.appendChild(renderMarkdown(e.text || ""));
    laneAdd(lane, task);
  } else if (k === "llm_start") {
    startActive(lane, "llm", "thinking (" + (e.tier || "?") + ")…");
  } else if (k === "llm_thinking") {
    if (!lane.think) {
      var d = el("details", "fold think k-think");
      var sum = el("summary");
      var meta = el("span", null, "thinking");
      sum.appendChild(meta);
      d.appendChild(sum);
      var body = el("div", "body");
      var pre = el("pre", "out", "");
      body.appendChild(pre);
      d.appendChild(body);
      lane.think = { pre: pre, meta: meta };
      laneAdd(lane, d);
    }
    lane.think.pre.textContent += e.text || "";
    lane.think.meta.textContent = "thinking";
  } else if (k === "llm_call") {
    endActive(lane, "llm");
    lane.think = null;
    closeStep(lane);
    if (e.text) {
      var msg = el("div", "msg");
      msg.appendChild(renderMarkdown(e.text));
      laneAdd(lane, msg);
    }
    laneAdd(lane, promptView(e));
    laneSpent(lane, e.cost_usd, false);
  } else if (k === "code") {
    closeStep(lane);
    stepCard(lane);
    into(lane, cell("code", e.text), "k-code");
    updateStats();
  } else if (k === "output") {
    into(lane, cell("output", e.text), "k-output");
  } else if (k === "media") {
    var img = el("img", "shot");
    img.src = e.src || "";
    img.alt = e.text || "screenshot";
    img.loading = "lazy";
    var holder = el("div", "cellbody");
    holder.appendChild(img);
    into(lane, holder, "k-output");
  } else if (k === "action_start") {
    startActive(lane, "a:" + e.text, e.text + (e.args ? "(" + e.args + ")" : ""));
  } else if (k === "action_end") {
    endActive(lane, "a:" + e.text);
    // A refusal is not a failure — it is the thing this harness claims to do,
    // and it reaches the trace three ways: the broker denying outright
    // (`decision: "deny"`), the call it gated raising PermissionDenied, and an
    // action the human refused at the gate, which records only `ok: false`
    // against an earlier `approval_resolved`. All read as refused; only a
    // genuine crash reads as an error.
    var denied = e.decision === "deny" || /PermissionDenied/.test(e.error || "");
    if (!denied && e.ok === false && lane.refused.has(e.text)) {
      lane.refused.delete(e.text);
      denied = true;
    }
    var ok = e.ok !== false && !denied;
    var chip = el("span", "chip " + (denied ? "deny" : ok ? "ok" : "err"));
    chip.appendChild(el("span", null, e.text));
    // Only when it is long enough to be worth knowing — every action carrying
    // "0.001s" is four characters of nothing on every row.
    if (e.elapsed_s >= 0.5) chip.appendChild(el("span", "t", e.elapsed_s + "s"));
    if (e.decision === "deny") chip.appendChild(el("span", "t", "refused by policy"));
    else if (e.error) chip.appendChild(el("span", "t", e.error));
    if (lane.step) {
      lane.step.chips.appendChild(chip);
    } else {
      var row = el("div", "note k-action");
      row.appendChild(chip);
      laneAdd(lane, row);
    }
  } else if (k === "approval_pending") {
    approvals.set(e.text, {
      label: (lane.isRoot ? "" : "[" + shortName(lane.name) + "] ") +
        "[" + (e.category || "") + "] " + e.text + " — " + (e.summary || "") +
        " (answer in the terminal)",
      t0: Date.now(),
    });
    renderBanner();
  } else if (k === "approval_resolved") {
    approvals.delete(e.text);
    renderBanner();
    var row = el("div", "note");
    if (e.outcome === "deny") lane.refused.add(e.text);
    var verdict = el("span", "chip " + (e.outcome === "deny" ? "deny" : "ok"));
    verdict.appendChild(el("span", null, e.text));
    verdict.appendChild(el("span", "t", "approval " + e.outcome));
    row.appendChild(verdict);
    into(lane, row);
  } else if (k === "notify") {
    var n = el("div", "note warn");
    n.appendChild(el("span", null, "note"));
    n.appendChild(renderMarkdown(e.text || ""));
    laneAdd(lane, n);
  } else if (k === "error") {
    endActive(lane, "llm");
    lane.think = null;
    closeStep(lane);
    laneAdd(lane, el("div", "note err", e.text));
    if (!lane.isRoot) laneDone(lane, "err", "error");
  } else if (k === "answer") {
    closeStep(lane);
    var ans = el("div", "answer");
    ans.appendChild(el("div", "who", "answer"));
    ans.appendChild(renderMarkdown(e.text || ""));
    laneAdd(lane, ans);
    if (!lane.isRoot) laneDone(lane, "done", "answered");
  } else if (k === "budget") {
    laneSpent(lane, e.spent_usd, true);
  } else if (k === "session_end") {
    endActive(lane, "llm");
    closeStep(lane);
    laneSpent(lane, e.spent_usd, true);
    laneAdd(lane, el("div", "note", "session ended"));
    if (!lane.isRoot && lane.head && lane.head.dot.className === "dot") {
      laneDone(lane, "done", "done");
    }
  } else if (k === "skill_use") {
    into(lane, el("div", "note", "skill " + (e.skill || "") + ": " + (e.outcome || "") +
      " " + (e.note || "")));
  } else if (k === "reflection") {
    laneAdd(lane, el("div", "note", "reflection: " + (e.text || "")));
  } else if (k === "worker") {
    into(lane, el("div", "note", e.text || ""));
  } else if (k === "llm_attempt") {
    laneAdd(lane, el("div", "note", "llm " + (e.text || "")));
  } else if (k === "note") {
    // preamble text, duplicated by the llm_call event — skip
  } else {
    // Unknown kind. A viewer that silently drops what it does not recognize is
    // worse than one that renders it plainly: a new trace kind (or an old
    // session replayed by a newer viewer) would simply not exist on screen,
    // with nothing to notice. Render the kind and whatever fields it carried.
    var rest = Object.keys(e)
      .filter(function (f) { return ["kind", "ts", "text", "session"].indexOf(f) === -1; })
      .map(function (f) {
        return f + "=" + (typeof e[f] === "object" ? JSON.stringify(e[f]) : e[f]);
      });
    laneAdd(lane, el("div", "note", k + (e.text ? ": " + e.text : "") +
      (rest.length ? " · " + rest.join(" ") : "")));
  }
}

/* ----------------------------------------------------------------- boot -- */
/* The scripts sit at the end of <body>, so the DOM is already there. The feed
 * runs next and starts calling `handle()` immediately — nothing may be waiting
 * on DOMContentLoaded, or a baked page would replay into a null log. */

rootLog = byId("log");
nowEl = byId("now");
bannerEl = byId("banner");
wireTheme();
wireChrome();

</script>
<script>

var __doc = document.getElementById('doc-body');
__doc.appendChild(renderMarkdown("# Suite D \u2014 the skill cost curve\n\nTwo arms of one experiment: the same save-then-reuse protocol (five runs of one\ntask over one shared skills root, haiku-4.5 at `tier=\"cheap\"`) pointed at two\ntask shapes. The **retrieval** arm ran 2026-07-31 ($0.0993 over five runs, plus\na $0.0200 calibration probe); the **discovery** arm ran later the same day\n($0.1577 over five runs, plus a $0.1949 set scrapped for a fixture bug \u2014\ndisclosed below). A **third set** \u2014 the discovery arm re-run after the\nbundled-code fix its first set exposed ($0.1534) \u2014 was added the same day and\nis published below the original, which is kept verbatim. Refreshing any set\ncosts real model calls, so this is a dated artifact rather than a CI product;\nthe offline suite (`make test`, `evals/test_skills.py`) keeps the machinery\nunder it from rotting silently.\n\n## The claim under test, and the answers\n\n**Claim:** the agent saves a skill on run 1 and reuses it on runs 2-5, so cost,\nlatency and steps per run should fall and then flatten.\n\n**Retrieval arm \u2014 no.** Runs 2-5 cost **+40%** more than run 1, took +19% more\nsteps and +15% more wall time. Every run was correct and used the skill.\n\n**Discovery arm \u2014 the curve bends, and something breaks it.** The two reuse\nruns that executed the frozen sequence collapsed to 2 fetches; the cheapest\n(run 5) finished in 5 steps at **-51%** of run 1's cost. But every reuse run\nfirst paid for a real defect the arm surfaced \u2014 the bundled code the agent\nsaved fails on import (below) \u2014 so one run re-walked the whole site and one\ndied at the step wall with the answer in hand. The mean says +17%; the\ndistribution says amortization is real here and an identifiable bug is eating\nit.\n\n**Discovery arm, re-run after the fix \u2014 the identified breakage is gone.**\nBundled code now runs with the session builtins ambient (the fix the first\nset's defect record asked for), and in the re-run the bundled function worked\non its **first call in all three reuse runs** \u2014 zero ImportErrors paid, the\nfrozen two-fetch sequence visible in each run's audit chain as broker-gated\nnested calls. The distribution's tail moved to where the counterfactual said it\nwould: the best reuse run finished in 5 steps at $0.0128, **-53%** against its\nauthoring run. The mean moved less \u2014 every reuse run also chose to re-verify\nthe skill's answer with direct fetches (one re-walked the whole site), which is\nwhat the task's own \"always re-read the source\" line asks of it. Details and\ncaveats below.\n\n**The boundary condition, stated as the finding:** a skill amortizes when the\ntask's cost is *discovery* (working out which pages, in which order, with what\ntransformation) and the reuse path is cheap to execute. It does not amortize\nwhen the cost is *retrieval* (the fetches themselves), because a procedure\ncannot lower the fetch floor \u2014 and the reuse path has its own per-run overhead\n(`search_tools` \u2192 `describe_tool`/`use_tool` \u2192 `record_skill_use`) that must be\npaid out of whatever discovery it removed. On the retrieval task that overhead\nexceeded the discovery saved. On the discovery task the saved discovery is ~3\nfetches plus the reasoning between them, which covers the overhead \u2014 when\nexecuting the skill does not itself misfire.\n\nTwo arms on one loopback corpus, one model, one harness, n=5 each. That is\nenough to place the boundary for this harness on this corpus, and nowhere near\nenough to say anything about \"skills\" in the abstract.\n\n## Arm 1 \u2014 retrieval (two known URLs)\n\nThe task: produce a billing summary from an invoice page and the remittance\npage it links. Both URLs are effectively given; the work is fetching and\narithmetic.\n\n| | run 1 | run 2 | run 3 | run 4 | run 5 |\n|---|---|---|---|---|---|\n| cost | $0.0150 | $0.0184 | $0.0218 | $0.0248 | $0.0193 |\n| steps | 8 | 8 | 11 | 12 | 7 |\n| wall | 16.7s | 17.1s | 20.1s | 21.0s | 18.4s |\n| skill | saved | reused | **re-saved** + reused | reused | reused |\n\nn=5: run 1 vs the runs 2-5 mean is **+40% cost, +19% steps, +15% wall**. All\nfive answered correctly and recorded a use; the mechanism engaged fully and\nbought nothing. Two reasons, both in the audit chain:\n\n- **The work is fetching, not figuring out.** Every run made exactly 2\n  successful `web.fetch` calls \u2014 the floor, which no procedure can lower.\n  Discovery (knowing the two URLs) was already a fraction of a run.\n- **Reuse has its own overhead, paid every run.** Run 1 spent its skill budget\n  on `search_tools` \u00d72 \u2192 `save_skill` \u2192 `record_skill_use`; runs 2-5 spent\n  theirs on `search_tools` \u2192 `describe_tool` \u2192 `record_skill_use`. The reuse\n  path is not shorter than the authoring path here, just different.\n\n**The agent saved prose, not code.** This arm ran before the lazy-bundled-code\nchange and its system-prompt nudge landed; `save_skill(files=\u2026)` went unused in\nall five runs, so following the runbook still meant re-writing the fetch and\nthe parse every time. The discovery arm, run after that change, is the direct\ntest of whether the nudge works \u2014 see below.\n\n## Arm 2 \u2014 discovery (a sequence the prompt does not reveal)\n\nThe task: report the current balance of a supplier-portal account, given only\nthe portal home page. The balance is deliberately not where it looks like it\nshould be. The intended walk: home \u2192 *Invoices & billing* (the plausible wrong\nturn \u2014 a note says balances moved and points at the help centre) \u2192 the help\narticle, which gives the statement-address **scheme**\n(`statement-\u003ccode>.html`, code lower-cased, hyphen dropped) \u2192 the profile page,\nwhich holds the code (`RT-1180`) \u2192 the assembled terminal URL. The balance and\na confirmation code exist only on that terminal page, no page links it\ndirectly, and the scorer additionally requires the run's audit chain to show a\nsuccessful fetch of it \u2014 so a run cannot shortcut the sequence, and a later run\ncannot replay the markers out of the skill's own text. This is the shape of the\ntask skills were designed for: everything expensive about run 1 is knowledge a\nlater run could reuse.\n\nProduced by `python -m evals.skills.run --arm discovery`, five runs, one shared\nskills root, $0.1577:\n\n| | run 1 | run 2 | run 3 | run 4 | run 5 |\n|---|---|---|---|---|---|\n| outcome | answered | **stopped:max_steps** | answered | answered | answered |\n| cost | $0.0278 | $0.0427 | $0.0313 | $0.0423 | $0.0136 |\n| steps | 11 | 18 | 12 | 16 | 5 |\n| wall | 26.5s | 25.8s | 21.4s | 25.1s | 13.2s |\n| corpus fetches | 5 | \u2014 | 2 | 5 | 2 |\n| skill | saved + recorded | reused + recorded | reused + recorded | reused + recorded | reused + recorded |\n\nHeadline mean (runs 2-5 vs run 1, the failed run included): cost +17%, steps\n+16%, wall -19%. The per-run record is what matters:\n\n- **Run 1 walked the site and saved real code.** Five fetches (home, billing,\n  help, profile, statement), then `save_skill(files={\"northwind_balance.py\":\n  \u2026})` bundling a complete `get_northwind_balance()` \u2014 profile fetch, regex for\n  the code, URL construction, statement fetch, extraction of all three fields.\n  **This is the direct positive on the `files=` change:** the retrieval arm's\n  agent saved prose five runs out of five; this arm's agent bundled code on its\n  first authoring run, unprompted by the task (the tasks are pinned by test to\n  never mention `files=` or bundling).\n- **Every reuse run hit the same defect: the bundled code fails on import.**\n  The model wrote `from pyharness import use_tool` inside the module;\n  `use_tool` is a kernel builtin, not a package export, so the first call\n  raises `ImportError`. All four reuse runs paid it (twice, in three of them).\n  There is currently no supported way for bundled code to reach a capability,\n  while the guidance (\"a fetch \u2026 belongs in `files`\") steers the agent into\n  writing exactly this. Logged in `agents/issues.md`, not fixed here.\n- **Where reuse recovered cheaply, the curve bent.** Runs 3 and 5 transcribed\n  the surfaced source (`describe_tool` prints bundled code precisely so a\n  reader can see it) into a cell and ran it: 2 fetches each \u2014 the frozen\n  sequence, against run 1's five. Run 5 did the whole task in 5 steps and\n  $0.0136, **51% below run 1**. That is the amortization the retrieval arm\n  could not show.\n- **Where it recovered expensively, the curve broke.** Run 4 gave up on the\n  skill after the ImportError and re-walked the site (5 fetches, 16 steps).\n  Run 2 burned four steps on unechoed `search_tools` calls, hit the\n  ImportError twice, re-walked the site, found the answer, recorded\n  `worked` \u2014 and hit the step wall before ever emitting the final line. Its\n  cost is in the table; its number is marked unusable.\n\nThe counterfactual is visible in the record rather than speculative: run 5 is\nwhat every reuse run looks like when executing the skill costs almost nothing.\nA working bundled-code path would make run 5 the mode, not the tail.\n\n## Arm 2, re-run after the bundled-code fix (2026-07-31, $0.1534)\n\nThe set above surfaced that bundled skill code had no supported way to reach a\ncapability (`from pyharness import use_tool` \u2192 ImportError, paid by all four\nreuse runs). That was fixed \u2014 bundled code now executes with the session's\nbuiltins seeded into its globals, every call broker-gated \u2014 and the arm was\nre-run under the same protocol: five runs, one fresh shared skills root,\nhaiku-4.5 at `tier=\"cheap\"`, per-run budget cap, approvals granted. Same task,\nsame corpus, same scorer; the only intended difference is the harness fix and\nits guidance (the system prompt's `save_skill` block now says builtins are in\nscope inside bundled files). Produced by\n`python -m evals.skills.run --arm discovery`:\n\n```\n\n  skill cost curve \u2014 discovery arm, 5 runs of one task ($0.1534)\n\n    run  outcome        cost      steps  llm  wall     skill / answer\n   !1    stopped:budget $0.0419   13     13     21.3s  no skill\n                                                      stopped:budget; NEVER REACHED THE TERMINAL PAGE; markers missing\n    2    answered       $0.0273   10     11     27.3s  saved northwind_supplier_balance, recorded northwind_supplier_balance:worked\n                                                      ok, 5 fetches\n    3    answered       $0.0381   11     12     26.6s  reused northwind_supplier_balance, recorded northwind_supplier_balance:worked\n                                                      ok, 4 fetches\n    4    answered       $0.0334   14     15     19.9s  reused northwind_supplier_balance, recorded northwind_supplier_balance:worked\n                                                      ok, 7 fetches\n    5    answered       $0.0128   5      6      11.5s  reused northwind_supplier_balance, recorded northwind_supplier_balance:worked\n                                                      ok, 4 fetches\n\n    run 1        $0.0419, 13 steps, 21.3s\n    runs 2-5      $0.0279 mean, 10.0 steps, 21.3s\n    delta        cost -33%, steps -23%, wall -0%\n\n    skill_run_costs (the view obs/index.py ships):\n      northwind_supplier_balance  run 1  $0.0273  answered\n      northwind_supplier_balance  run 2  $0.0381  answered\n      northwind_supplier_balance  run 3  $0.0334  answered\n      northwind_supplier_balance  run 4  $0.0128  answered\n\n  runs whose number is not usable:\n    run 1: stopped:budget; NEVER REACHED THE TERMINAL PAGE; markers missing\n\n```\n\nRead the per-run record before the headline delta \u2014 the -33% is against a run\nthat failed for reasons unrelated to skills:\n\n- **Run 1 never discovered the sequence at all.** It went down the\n  `http.open_session` road (7 session opens, 5 requests, one browser attempt),\n  never assembled the statement URL, and hit the budget wall with no skill\n  saved and zero `web.fetch` calls. Model variance in discovery, not a skill\n  or harness effect; its number is marked unusable and it left nothing behind.\n- **Run 2 is therefore the authoring run**: walked the site (5 fetches),\n  bundled a complete `get_northwind_balance()` \u2014 and this author, having seen\n  the new guidance, opened it with `web = use_tool(\"web\")` rather than an\n  import. Against run 2, the reuse mean ($0.0281) is **+3%** and the best\n  reuse run (5) is **-53%**.\n- **The fix held in all three reuse runs.** Each called the bundled function\n  first, it worked on the first call, and the audit chain shows the exact\n  claim under test: `tools.invoke northwind_supplier_balance.get_northwind_\n  balance` \u2192 nested `web.fetch` (profile) \u2192 nested `web.fetch` (statement),\n  every hop broker-gated and separately audited. No run wrote\n  `import pyharness` in any cell. The prior set's failure mode did not recur.\n- **What kept the mean flat is re-verification, not breakage.** After the\n  skill returned the answer, runs 3 and 5 re-fetched the same two pages\n  directly and run 4 re-walked the whole five-page chain. The task's own\n  \"always re-read the source\" line (and the scorer's terminal-page evidence\n  requirement) make some re-reading correct behavior; the frozen sequence\n  means it costs 2 fetches instead of 5, which is precisely run 5's shape.\n- **The saved skill froze the corpus server's ephemeral port** into its URLs\n  (`127.0.0.1:56952`). Within one set the server is one process, so it worked;\n  a later session against a restarted corpus would fail on the stale origin.\n  Real-world skill fragility, visible here because loopback ports rotate \u2014\n  noted, not scored.\n\nSame caveats as the set above (n=5, one corpus, one model, cache accounting,\ninstructed reuse), plus one more: the two discovery sets ran on different days'\nmodel states and their run 1s differ in kind (failed no-skill run vs\nsuccessful authoring run), so cross-set comparisons should use the per-run\nrecord, not the two headline deltas.\n\n## Changed after a paid run \u2014 full disclosure\n\nNothing in either arm was tuned after seeing its published numbers. Two things\nwere changed after *a* paid run, and both are disclosed here:\n\n- **Arm 1's scorer, after its run.** The check originally required the literal\n  `1240.00`; three runs reported the Python float `1240.0` having fetched both\n  pages and summed correctly, so the literal was failing them on decimal\n  places. It now matches a pattern. The change reclassified two runs from \"not\n  usable\" to \"usable\" and changed no cost, step or latency number; the board\n  was re-derived from the same five session dirs with `--rescore`, not re-run.\n- **The discovery arm's terminal page, after a scrapped first set.** The first\n  paid set (five runs, $0.1949) is not published: the statement page's balance\n  sat in a table that trafilatura \u2014 the reduction `web.fetch` actually applies\n  \u2014 classified as boilerplate and dropped, so **no run could see the answer at\n  any price**. All five runs failed (four at a budget/step wall, one answering\n  with a number from the wrong page). The page was restructured to the\n  invoice's proven shape, an offline test now pins every hop of the chain\n  through the real extractor (`test_every_hop_of_the_discovery_chain_survives_\n  extraction`), and the published set ran with no further changes. This was\n  fixing a broken fixture, not tuning a live one \u2014 the scrapped set's runs\n  could not reach the thing being measured \u2014 but it is a post-run change to the\n  task surface and is reported as one. Its cost is included in the totals.\n\n## What this does not say\n\n- **Not a fact about skills in general.** One corpus, one harness, two task\n  shapes, and the discovery arm's reuse numbers are dominated by one\n  identifiable bug. n=5 per arm supports a shape, not a statistic \u2014 the\n  discovery arm's later-run costs span $0.0136-$0.0427, which is the variance\n  of one model recovering from one error two different ways.\n- **Not a fact about model choice.** haiku-4.5 at `tier=\"cheap\"` throughout.\n- **Not a clean cost measurement.** Prompt caching is live and the trace\n  records only *uncached* input tokens (`cache_read`/`cache_creation` are\n  dropped before the trace \u2014 logged in `agents/issues.md`), so per-run cost\n  cannot be decomposed from the published record.\n- **Run 1 is not a clean no-skill baseline.** It includes authoring the skill;\n  later runs carry a growing recent-sessions preamble. Runs 2-5 differ from\n  run 1 in more than one way.\n- **Reuse was instructed, not spontaneous.** Both tasks tell the agent to look\n  for a saved skill and save one if absent \u2014 deliberately, and pinned by test:\n  the question is whether reuse is *cheaper*, and leaving it implicit risks a\n  flat curve produced by a model that never saved anything. Equally pinned:\n  neither task mentions `files=` or bundling, so the code-bundling observed in\n  the discovery arm is attributable to the system prompt, not the task.\n- **Bundling is not yet reliable.** Across the two post-change authoring runs\n  (the scrapped set's and the published set's), one bundled code and one saved\n  prose only \u2014 though the prose-only author had never seen the full procedure\n  work, since the scrapped set's terminal page was unreadable.\n\n## The boards\n\nRegenerate from the sessions with `python -m evals.skills.run --rescore\n.sessions/\u003croot>` (`.sessions/` is gitignored, so this only works on the\nmachine that ran them: retrieval `skills-20260731`, discovery\n`skills-20260731`, discovery re-run `skills-20260731`).\n\nRetrieval arm, verbatim from the run:\n\n```\n\n  skill cost curve \u2014 5 runs of one task ($0.0993)\n\n    run  outcome        cost      steps  llm  wall     skill / answer\n    1    answered       $0.0150   8      9      16.7s  saved northwind_billing_summary, recorded northwind_billing_summary:worked\n                                                      ok, 2 fetches\n    2    answered       $0.0184   8      9      17.1s  reused northwind_billing_summary, recorded northwind_billing_summary:worked\n                                                      ok, 2 fetches\n    3    answered       $0.0218   11     12     20.1s  saved northwind_billing_summary, reused northwind_billing_summary, recorded northwind_billing_summary:worked\n                                                      ok, 2 fetches\n    4    answered       $0.0248   12     13     21.0s  reused northwind_billing_summary, recorded northwind_billing_summary:worked\n                                                      ok, 2 fetches\n    5    answered       $0.0193   7      8      18.4s  reused northwind_billing_summary, recorded northwind_billing_summary:worked\n                                                      ok, 2 fetches\n\n    run 1        $0.0150, 8 steps, 16.7s\n    runs 2-5      $0.0211 mean, 9.5 steps, 19.1s\n    delta        cost +40%, steps +19%, wall +15%\n\n    skill_run_costs (the view obs/index.py ships):\n      northwind_billing_summary  run 1  $0.0150  answered\n      northwind_billing_summary  run 2  $0.0184  answered\n      northwind_billing_summary  run 3  $0.0218  answered\n      northwind_billing_summary  run 4  $0.0248  answered\n      northwind_billing_summary  run 5  $0.0193  answered\n\n```\n\nDiscovery arm, verbatim from the run:\n\n```\n\n  skill cost curve \u2014 discovery arm, 5 runs of one task ($0.1577)\n\n    run  outcome        cost      steps  llm  wall     skill / answer\n    1    answered       $0.0278   11     12     26.5s  saved northwind_portal_balance, recorded northwind_portal_balance:worked\n                                                      ok, 5 fetches\n   !2    stopped:max_steps $0.0427   18     18     25.8s  reused northwind_portal_balance, recorded northwind_portal_balance:worked\n                                                      stopped:max_steps; markers missing\n    3    answered       $0.0313   12     13     21.4s  reused northwind_portal_balance, recorded northwind_portal_balance:worked\n                                                      ok, 2 fetches\n    4    answered       $0.0423   16     17     25.1s  reused northwind_portal_balance, recorded northwind_portal_balance:worked\n                                                      ok, 5 fetches\n    5    answered       $0.0136   5      6      13.2s  reused northwind_portal_balance, recorded northwind_portal_balance:worked\n                                                      ok, 2 fetches\n\n    run 1        $0.0278, 11 steps, 26.5s\n    runs 2-5      $0.0325 mean, 12.8 steps, 21.4s\n    delta        cost +17%, steps +16%, wall -19%\n\n    skill_run_costs (the view obs/index.py ships):\n      northwind_portal_balance  run 1  $0.0278  answered\n      northwind_portal_balance  run 2  $0.0427  stopped:max_steps\n      northwind_portal_balance  run 3  $0.0313  answered\n      northwind_portal_balance  run 4  $0.0423  answered\n      northwind_portal_balance  run 5  $0.0136  answered\n\n  runs whose number is not usable:\n    run 2: stopped:max_steps; markers missing\n\n```\n\nThe `skill_run_costs` block in each board is read verbatim out of the session\nindex \u2014 the same view the agent itself reaches through `stats()`. The suite\nreports it rather than computing its own per-run cost, so what is published\nhere is the number the harness already knows how to answer with.\n"));
// A board opens with its own `# Title`, and the shell already printed one. Let

(function () {

// The rail's switcher slot becomes a table of contents on a board: same

(function () {

  // Sections always; subsections only while they are still navigation. The
  // scoreboard has one h3 per attack — forty of them is a second document, not

  var deep = __doc.querySelectorAll('.md > h3').length < 20;
  var frag = document.createDocumentFragment();
  var n = 0;
  __doc.querySelectorAll(deep ? '.md > h2, .md > h3' : '.md > h2').forEach(function (h) {
    var id = 'h' + (++n);
    h.id = id;
    var a = el('a', 'sitem');
    a.href = '#' + id;
    a.style.paddingLeft = h.tagName === 'H3' ? '22px' : '10px';
    a.appendChild(el('span', 'n', h.textContent));
    frag.appendChild(a);
  });

})();
