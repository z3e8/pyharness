[project]
name = "pyharness"
version = "0.1.0"
description = "An AI agent whose action space is Python."
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40", "httpx>=0.27"]

[project.scripts]
pyharness = "pyharness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness"]
