[project]
name = "pyharness"
version = "0.1.0"
description = "An AI agent whose action space is Python."
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40", "httpx>=0.27", "cryptography>=42"]

[project.scripts]
pyharness = "pyharness.cli:main"
pyharness-observe = "pyharness.observe:main"
pyharness-vault = "pyharness.cli_vault:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness"]
