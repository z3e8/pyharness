[project]
name = "pyharness"
version = "0.1.0"
description = "An AI agent whose action space is Python."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Zane Hensley", email = "177496803+z3e8@users.noreply.github.com" },
]
keywords = [
    "ai",
    "agent",
    "llm",
    "anthropic",
    "claude",
    "code-execution",
    "jupyter-kernel",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "cryptography>=42",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    # Web page perception (broker/capabilities/page.py): trafilatura reduces an
    # HTML body to clean readable content, lxml drives the links/forms affordance
    # pass. Core, not an optional extra — unlike the browser, a good default
    # `web.fetch` is table stakes, and the stdlib fallback only covers the
    # degraded case. lxml is declared explicitly because page.py imports it
    # directly (trafilatura also pulls it in transitively).
    "trafilatura>=2.1",
    "lxml>=6.1",
]

[project.optional-dependencies]
# The browser lane (BrowserCapability). Heavy and needs a separate chromium
# binary (`playwright install chromium`), so it is opt-in: `pip install
# pyharness[browser]`. Lazy-imported, so core install and the tests never need it.
browser = ["playwright>=1.61"]

# Developer toolchain (PEP 735 group; `uv sync` installs it by default, or
# `uv pip install -e . --group dev`). One command gets a contributor set up to
# run the tests, linter/formatter, and type-checker exactly as CI does.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
    "mypy>=2.3",
]

[project.urls]
Homepage = "https://github.com/z3e8/pyharness"
Repository = "https://github.com/z3e8/pyharness"
Issues = "https://github.com/z3e8/pyharness/issues"

[project.scripts]
pyharness = "pyharness.cli.main:main"
pyharness-vault = "pyharness.cli.vault:main"
pyharness-mcp = "pyharness.cli.mcp:main"
pyharness-index = "pyharness.cli.index:main"
pyharness-watch = "pyharness.obs.watch:main"
pyharness-profiles = "pyharness.cli.profiles:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyharness"]

# --- Developer tooling ---------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# A pragmatic default set: pyflakes (F) + a slice of pycodestyle (E/W), import
# sorting (I), pyupgrade (UP), and flake8-bugbear (B). E501 (line-too-long) is
# deliberately not enforced by the linter — the formatter owns code line length,
# and long strings/comments that it cannot reflow are left alone rather than
# papered over with noqas.
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The remote-kernel and IPC tests deliberately assert against broad exceptions
# (`pytest.raises(Exception)`) to prove a decode/reconstruct path fails at all —
# narrowing the type is not the point of those assertions.
"tests/*" = ["B017"]
# These two package inits order imports by hand to break an import cycle
# (capabilities import core.workspace, which re-enters the top package): the
# `SpawnResult`/`.core` imports MUST stay in their documented position, so import
# sorting is disabled here rather than allowed to reintroduce the cycle.
"pyharness/__init__.py" = ["I001"]
"pyharness/broker/capabilities/__init__.py" = ["I001"]

[tool.mypy]
# Lenient by design and NON-BLOCKING in CI. The codebase is large and largely
# untyped; a strict pass is out of scope (see agents/issues.md for the remaining
# type-debt path — ~100 findings today). This config drops the missing-import and
# missing-annotation noise so `mypy` runs and surfaces obvious mistakes, without
# the task turning into a typing project.
python_version = "3.11"
files = ["pyharness"]
ignore_missing_imports = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
# No disallow_untyped_defs / strict — annotations are added opportunistically.

[tool.pytest.ini_options]
# Test discovery + defaults. The autouse egress-DNS stub lives in
# tests/conftest.py (kept there, not duplicated here). Coverage is intentionally
# NOT wired into addopts: running under pytest-cov re-execs the sandbox child in
# a way that cannot find `_pytest`, which reddens 6 sandbox tests — use a
# dedicated coverage invocation if you need it.
# `evals` is here so the adversarial suite (and the scorer's own meta-tests) run
# in CI: it is offline, deterministic and a few seconds long, so the usual
# argument for keeping an attack suite out of the commit gate does not apply,
# while the argument for keeping it in — an unrun suite silently stops
# describing the system — does. See evals/test_suite_a.py.
testpaths = ["tests", "evals"]
addopts = "-q"
